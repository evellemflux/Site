<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    
    <main class="container">
        <section class="cadastro-card">

            <div class="Homemtreinando">
                <img src="Homemtreinando.png" alt="">
            </div>

            <div class="form-section">

            
            <div class="tabs">
                <button class="tab active" id="loginTab">
                    Login
                </button>

                <button class="tab cadastro" id="cadastroTab">
                    Cadastro
                </button>
            </div>

            <form id="cadastroForm">

                <h2>É novo por aqui? Faça seu cadastro!</h2>

                <p class="subtitle">
                    Acesse com seus dados cadastrais
                </p>

                <div class="input-group">
                    <label for="name">Nome</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="name" id="name" placeholder="Nome completo:">
                    </div>
                </div>

                <div class="input-group">
                    <label for="name">Data de nascimento</label>

                    <div class="input-box">
                        <i class="fa-solid fa-calendar-days"></i>
                        <input type="date" id="date" placeholder="00/00/0000">
                    </div>
                </div>

                <div class="input-group">
                    <label for="name">Email</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email:" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="name">CPF</label>

                    <div class="input-box">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="name">Senha</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" placeholder="Senha:" required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="name">Confirme sua senha</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" placeholder="Senha:" required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Cadastro
                </button>

                <div class="divider">
                    <span></span>
                    <small>OU</small>
                    <span></span>
                </div>

                <button type="button" class="google-button">
                    <i class="fa-brands fa-google"></i>
                    Entre com o Google
                </button>

              
                <a href="#" class="forgot-password">
                    Esqueceu sua senha?
                </a>

            </form>

        </div>

    </section>
</main>
</body>
</html>
